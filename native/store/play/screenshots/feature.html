<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Outfit';src:url('../../screenshots/assets/fonts/Outfit[wght].ttf') format('truetype');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1024px;height:500px;overflow:hidden;position:relative;font-family:'Outfit',sans-serif;color:#F4F1FA;
background:#0d0b1a url('../../screenshots/assets/bg-ipad.jpg') center/cover no-repeat}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,11,26,.15) 0%,rgba(13,11,26,.55) 45%,rgba(13,11,26,.85) 100%)}
.hero{position:absolute;left:70px;top:50%;transform:translateY(-50%);height:400px;filter:drop-shadow(0 0 60px rgba(92,196,176,.35)) drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.copy{position:absolute;left:470px;right:56px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
h1{font-size:104px;font-weight:800;letter-spacing:-.04em;line-height:1;
background:linear-gradient(135deg,#5CC4B0,#9B6BBE 55%,#E8C840);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:18px;font-size:40px;font-weight:600;line-height:1.15;letter-spacing:-.02em;text-shadow:0 4px 24px rgba(0,0,0,.6)}
p em{font-style:normal;color:#5CC4B0}
</style></head><body>
<div class="scrim"></div>
<img class="hero" src="../../../assets/icon-hero.png">
<div class="copy"><h1>SquadPad</h1><p>Your phone is the <em>controller</em></p></div>
</body></html>
